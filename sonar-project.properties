# SonarCloud — auditoría continua con quality gate "clean as you code" (#83).
#
# El gate de Sonar mide sobre CÓDIGO NUEVO, que es lo que el ratchet global de
# vitest.config.ts no puede dar: aquí se exige ≥80% de cobertura en lo que toca
# cada PR, sin obligar a cubrir el legacy que se migrará a Next.js (#28).
#
# Organización creada a mano (no importada de GitHub), así que las claves NO siguen
# la convención <cuenta>_<repo>: son las que devuelve la API de SonarCloud.
sonar.projectKey=nauticops_app
sonar.organization=nauticops

# Un solo árbol: los tests viven junto al código, así que se separan por patrón
# en vez de por carpeta (si no, Sonar indexaría el mismo fichero dos veces).
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.test.mjs

# Fuera del análisis: generados, dependencias y la demo v2, que es un HTML
# autocontenido de ~1.300 líneas con JS y CSS inline servido tal cual por Vercel.
sonar.exclusions=\
  dist/**,\
  coverage/**,\
  node_modules/**,\
  public/**,\
  scripts/fixtures/**,\
  src/pages/demos/**/data.json,\
  src/pages/demos/**/vessel-cache.json,\
  **/*.d.ts,\
  **/*.png,\
  **/*.jpg,\
  **/*.jpeg,\
  **/*.ico,\
  **/*.webp,\
  bun.lockb

# El scanner intenta leer TODO lo que indexa como texto: los binarios (iconos,
# el logo, la foto del hero, el bun.lockb huérfano) provocaban un
# "Invalid character encountered ... for encoding UTF-8" que en el panel aparece
# como "problems with file encoding in the source code". No es un problema de
# codificación: es que no deberían estar indexados. Se declara el encoding igual,
# para no depender del locale del runner.
sonar.sourceEncoding=UTF-8

# Cobertura: se espeja la superficie que mide Vitest. Sin esto, Sonar contaría
# como "sin cubrir" todo el marketing y los TSX de las demos, y el porcentaje
# dejaría de significar lo mismo en los dos sitios. El motivo de cada exclusión
# está argumentado en vitest.config.ts — cambiar uno sin el otro los desalinea.
#
# Sin llaves: Sonar NO expande `{a,b}` y además la coma separa entradas de la
# lista, así que `src/{main,App}.tsx` se parte en dos patrones rotos. Se vio en el
# log del primer análisis, que las imprimió como `src/{main, App}.tsx`.
sonar.coverage.exclusions=\
  src/components/**,\
  src/pages/**/Demo*.tsx,\
  src/pages/demos/marin/FleetMap.tsx,\
  src/pages/demos/marin/SchedulePlayback.tsx,\
  src/pages/Index.tsx,\
  src/pages/LegalPage.tsx,\
  src/pages/NotFound.tsx,\
  src/pages/ShippingAgentsPage.tsx,\
  src/main.tsx,\
  src/App.tsx,\
  src/lib/translations.ts,\
  src/lib/translations/**,\
  src/test/**,\
  scripts/*.mjs,\
  **/*.config.ts,\
  **/*.config.js,\
  **/*.config.mjs

# lcov lo genera `npm run test:coverage`; en CI llega como artefacto del job verify.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
