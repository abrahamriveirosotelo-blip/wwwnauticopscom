name: CI

# Runs the same gate as `npm run verify` on every PR and on everything that
# lands on main — including the data commits the demo cron pushes directly.
#
# This check is ADVISORY: making it block a merge needs required status checks,
# which needs repo admin (see the follow-up issue). Until then the real barrier
# is the pre-push hook in .githooks/, and this is the safety net for when a push
# skips it.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  # Superseding a PR run is fine — a new commit replaces it. On main it is not:
  # the data cron pushes every 2h, and a cancelled run counts as "not passed",
  # so once `verify` becomes a required check (#90) it would leave commits stuck.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    # The gate takes ~2 min; the GitHub default is 6 hours, which a hung
    # `npm ci` would happily burn.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Gate completo (format:check → lint → typecheck → test+coverage → build)
        run: npm run verify

      # lcov queda disponible para SonarCloud (#83) y para inspeccionarlo sin
      # reproducir el run en local.
      - name: Publicar informe de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: warn
          retention-days: 14

  # Auditoría continua (#83). Se salta entero mientras no exista el secreto
  # SONAR_TOKEN, para que el repo no arrastre un check en rojo hasta que alguien
  # con admin cree el proyecto en SonarCloud y lo añada. Pasos de activación: #96.
  sonar:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: ¿Está configurado SonarCloud?
        id: gate
        run: echo "ready=${{ secrets.SONAR_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

      # Entrecomillado a propósito: en un escalar YAML sin comillas, ` #` abre un
      # comentario y se comería el resto de la orden, dejando el `echo` sin cerrar.
      - if: steps.gate.outputs.ready != 'true'
        run: 'echo "SONAR_TOKEN no configurado: analisis omitido (ver issue 96)."'

      - uses: actions/checkout@v4
        if: steps.gate.outputs.ready == 'true'
        with:
          # Sonar necesita el histórico completo para fechar cada línea y saber
          # qué es "código nuevo"; con el clon superficial lo daría todo por nuevo.
          fetch-depth: 0

      - name: Recuperar la cobertura del job verify
        if: steps.gate.outputs.ready == 'true'
        uses: actions/download-artifact@v4
        with:
          name: coverage-lcov
          path: coverage

      - name: Analizar
        if: steps.gate.outputs.ready == 'true'
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
